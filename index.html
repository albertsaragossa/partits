<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partits de la setmana</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F5;--card:#FFFFFF;--ink:#14202B;--muted:#4B5A68;--line:#D3DDE3;--a:#0B7A5E;--a-soft:#DDF2EB;--b:#3B49B5;--b-soft:#E2E5F8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F171D;--card:#18232B;--ink:#EEF3F6;--muted:#A9B7C2;--line:#2A3A45;--a:#4FD0A8;--a-soft:#16342D;--b:#9AA6FF;--b-soft:#222850;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F171D;--card:#18232B;--ink:#EEF3F6;--muted:#A9B7C2;--line:#2A3A45;--a:#4FD0A8;--a-soft:#16342D;--b:#9AA6FF;--b-soft:#222850;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.125rem/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.when,.hour{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;font-weight:800}
h1{font-size:clamp(1.9rem,6vw,2.8rem);line-height:1.05;margin:8px 0 6px}
.sub{color:var(--muted);margin:0 0 24px;font-size:1rem}
.teams{display:grid;gap:28px}
@media (min-width:820px){.teams{grid-template-columns:1fr 1fr;align-items:start}}
.team{--c:var(--a);--soft:var(--a-soft)}
.team.tb{--c:var(--b);--soft:var(--b-soft)}
.who{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin:0 0 12px}
.who h2{font-size:2rem;line-height:1;margin:0;color:var(--c)}
.who span{color:var(--muted)}
.hero{background:var(--card);border:3px solid var(--c);border-radius:18px;padding:18px 18px 20px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--soft);color:var(--ink);font-weight:700;padding:4px 12px;border-radius:99px;font-size:1rem}
.when{font-size:clamp(1.6rem,5.5vw,2.2rem);line-height:1.1;margin:14px 0 0}
.hour{font-size:clamp(3rem,13vw,4.5rem);line-height:1;color:var(--c);margin:2px 0 12px}
.vs{font-size:1.3rem;font-weight:700;margin:0 0 6px}
.where{margin:0}
.where a{color:var(--c);font-weight:700}
.blurb{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:1.15rem}
.more h3{font-size:1.1rem;margin:22px 0 4px;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row small{display:block;color:var(--muted);font-size:1rem}
.row .h{font-weight:700;white-space:nowrap;color:var(--c)}
.res{margin-top:14px}
.res summary{display:inline-block;cursor:pointer;list-style:none;background:var(--c);color:var(--card);font-weight:700;padding:11px 20px;border-radius:99px}
.res summary::-webkit-details-marker{display:none}
.res ul{list-style:none;margin:10px 0 0;padding:0}
.res li{padding:10px 0;border-top:1px solid var(--line)}
.res b{color:var(--c);margin-right:8px}
.res small{color:var(--muted);font-size:1rem}
.res li span{display:block}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:20px;color:var(--muted)}
footer{margin-top:34px;color:var(--muted);font-size:1rem;border-top:1px solid var(--line);padding-top:14px}
a:focus-visible{outline:3px solid var(--c,var(--a));outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Partits de la setmana</h1>
<p class="sub" id="upd">Calendari oficial.</p>
<div class="teams" id="teams"></div>
<footer>Els dies i horaris poden canviar. Per a la informació més actualitzada, consulteu l’app El Consell o <a href="https://www.jeeb.cat">jeeb.cat</a>.</footer>
</main>
<script>
var WD=["diumenge","dilluns","dimarts","dimecres","dijous","divendres","dissabte"];
var MO=["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];
function de(m){return /^[aeiou]/.test(m)?"d’"+m:"de "+m}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function when(x){return cap(WD[x.getDay()])+" "+x.getDate()+" "+de(MO[x.getMonth()])}
function dt(m){return new Date(m.d+"T"+m.t+":00")}
function weekend(n){var s=new Date(n.getFullYear(),n.getMonth(),n.getDate()),w=s.getDay();
 if(w===6)s.setDate(s.getDate()-1);else if(w===0)s.setDate(s.getDate()-2);else s.setDate(s.getDate()+((5-w+7)%7));
 var e=new Date(s);e.setDate(e.getDate()+3);return[s,e]}
function map(m){var q=m.geo||[m.place,m.addr,"Barcelona"].filter(Boolean).join(", ");return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
function vs(m,t){return m.h?t.me+" contra "+m.rival:m.rival+" contra "+t.me}
function auto(m,t){var i=t.matches.indexOf(m)%3;return (m.h?["Partit a casa: la pista és nostra, tots a la grada!","Jugem a casa. Porteu-hi alegria i ganes d’animar!","Toca jugar a casa i viure el partit ben a prop!"]:["Sortim a jugar fora. Reviseu el lloc i a animar!","Visita al camp del rival: a donar suport a l’equip!","Partit fora de casa. Comproveu bé el lloc abans de sortir!"])[i]}
function hint(m,t){var p=(t.past||[]).filter(function(x){return x.rival===m.rival})[0];if(!p)return "";var s=p.gf+"-"+p.gc,d=p.gf-p.gc;
 if(d>=3)return "A la ida els vam golejar ("+s+"). Confiança, però sense relaxar-se!";
 if(d>0)return "A la ida vam guanyar ajustat ("+s+"). Rival igualat: a donar-ho tot!";
 if(d===0)return "A la ida vam empatar ("+s+"). Rival de tu a tu, tot pot passar!";
 if(d>-3)return "A la ida vam perdre per poc ("+s+"). Toca revenja!";
 return "A la ida ens van guanyar clarament ("+s+"): rival dur, però a per la revenja!"}
function resBlock(t){if(!t.past||!t.past.length)return "";return '<details class="res"><summary>Consultar resultats</summary><ul>'+t.past.slice().reverse().map(function(p){var s=p.h?t.me+" "+p.gf+" - "+p.gc+" "+p.rival:p.rival+" "+p.gc+" - "+p.gf+" "+t.me,r=p.gf>p.gc?"Victòria":p.gf<p.gc?"Derrota":"Empat";return '<li><b>'+r+'</b><small>'+when(new Date(p.d+"T12:00:00"))+'</small><span>'+s+'</span></li>'}).join("")+'</ul></details>'}
function render(t){
 var n=new Date(),head='<div class="who"><h2>'+t.name+'</h2><span>'+t.sub+'</span></div>';
 var up=t.matches.map(function(m){return{m:m,d:dt(m)}}).filter(function(x){return x.d.getTime()>n.getTime()-2*3600000}).sort(function(a,b){return a.d-b.d});
 if(!up.length)return head+'<div class="empty">'+(t.matches.length?"No queden més partits al calendari.":"Encara no hi ha partits d’aquest equip. Aviat s’hi afegirà el calendari.")+'</div>';
 var w=weekend(n),f=up[0],m=f.m,inW=f.d>=w[0]&&f.d<w[1];
 var h=head+'<article class="hero"><div class="tags"><span class="tag">'+(inW?"Aquest cap de setmana":"Proper partit")+'</span><span class="tag">'+(m.h?"A casa":"Fora")+'</span></div>'
 +'<p class="when">'+when(f.d)+'</p><p class="hour">'+m.t+' h</p><p class="vs">'+vs(m,t)+'</p>'
 +'<p class="where">'+m.place+(m.addr?', '+m.addr:'')+'. <a href="'+map(m)+'" target="_blank" rel="noopener">Veure al mapa</a></p>'
 +'<p class="blurb">'+(m.blurb||hint(m,t)||auto(m,t))+'</p></article>'+resBlock(t);
 var rest=up.slice(1,6),more=up.length-6;
 if(rest.length){h+='<div class="more"><h3>Més endavant</h3>'+rest.map(function(x){return '<div class="row"><div><b>'+when(x.d)+'</b><small>'+(x.m.h?"A casa contra ":"Fora contra ")+x.m.rival+'</small></div><div class="h">'+x.m.t+' h</div></div>'}).join("")+(more>0?'<p class="sub">I encara queden '+more+' partits més fins a final de temporada.</p>':'')+'</div>'}
 return h;
}
var box=document.getElementById("teams");
function nx(t){var n=Date.now()-2*3600000,a=t.matches.map(dt).filter(function(d){return d.getTime()>n}).sort(function(a,b){return a-b});return a.length?a[0].getTime():9e15}
function start(data){
 if(data.updated){var d=new Date(data.updated+"T12:00:00");document.getElementById("upd").textContent="Calendari oficial. Última actualització: "+d.getDate()+" "+de(MO[d.getMonth()])+" de "+d.getFullYear()+"."}
 var teams=data.teams.map(function(t){var all=t.matches||[];t.past=all.filter(function(m){return m.gf!=null});t.matches=all.filter(function(m){return m.gf==null});return t});
 teams.sort(function(a,b){return nx(a)-nx(b)}).forEach(function(t){var s=document.createElement("section");s.className="team "+t.cls;s.innerHTML=render(t);box.appendChild(s)});
}
fetch("data.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(start).catch(function(){box.innerHTML='<div class="empty">No s’han pogut carregar els partits. Torneu-ho a provar més tard.</div>'});
</script>
</body>
</html>
