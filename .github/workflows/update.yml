name: Actualitza partits
on:
  schedule:
    - cron: "0 6,18 * * *"
    - cron: "15 8-20/2 * * 5,6,0"
  workflow_dispatch:
  push:
    paths: ["data/teams/**", "scripts/**"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update.py
      - name: Desa els canvis
        run: |
          git config user.name "partits-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Actualitza partits" && git push)
